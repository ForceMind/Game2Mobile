name: Game2MobileDiagnostics
options:
  bundleIdPrefix: com.game2mobile.diagnostics
  deploymentTarget:
    iOS: "18.0"
targets:
  Game2MobileDiagnostics:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../dm/ios/Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Game2Mobile Diagnostics
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.game2mobile.diagnostics.smoke
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      ENABLE_BITCODE: NO
      CODE_SIGN_STYLE: Manual
      GENERATE_INFOPLIST_FILE: NO
schemes:
  Game2MobileDiagnostics:
    build:
      targets:
        Game2MobileDiagnostics: all
