name: Import vetted Windows operator patch (feature branch only)
on:
  push:
    branches: [feat/windows-native-operator]
permissions:
  contents: write
jobs:
  import-public-source:
    if: github.event.head_commit.message == 'Stage pinned Windows operator source patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify, apply, test and submit public source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/windows-transfer/part-{n}.txt').read_text(encoding='ascii') for n in range(7))
          if len(encoded) != 24076:
              raise SystemExit('Pinned source length mismatch')
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if len(patch) != 64424 or hashlib.sha256(patch).hexdigest() != 'aff1ab98b883eecb250b2dd1f00089f123628180da8cbfbd6da4057955b42746':
              raise SystemExit('Pinned source digest mismatch')
          Path('/tmp/g2m-win.patch').write_bytes(patch)
          PY
          git apply --check /tmp/g2m-win.patch
          git apply /tmp/g2m-win.patch
          # GitHub Actions GITHUB_TOKEN has contents:write but no workflows permission.
          # The final workflow is installed with the GitHub connector after this run.
          rm .github/workflows/windows-operator.yml
          rm -rf .github/windows-transfer
          git add -A
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          wanted = {
              'README.md', 'README.zh-CN.md', 'dm/launcher/README.zh-CN.md',
              'dm/launcher/WindowsOperator/.gitignore',
              'dm/launcher/WindowsOperator/App/Game2Mobile.Operator.Windows.csproj',
              'dm/launcher/WindowsOperator/App/MainForm.cs',
              'dm/launcher/WindowsOperator/App/Program.cs',
              'dm/launcher/WindowsOperator/Core/BootLogInspector.cs',
              'dm/launcher/WindowsOperator/Core/Game2Mobile.Operator.Core.csproj',
              'dm/launcher/WindowsOperator/Core/Inspections.cs',
              'dm/launcher/WindowsOperator/README.zh-CN.md',
              'dm/launcher/WindowsOperator/Smoke/Game2Mobile.Operator.Smoke.csproj',
              'dm/launcher/WindowsOperator/Smoke/Program.cs',
              'docs/ASSET_FREE_CLOSEOUT.zh-CN.md',
              'docs/PROJECT_STATUS.md', 'docs/S2ARM_INTEGRATION_PLAN.zh-CN.md',
              'scripts/g2mctl.py', 'scripts/tests/test_windows_read_only.py',
          }
          wanted.update({f'.github/windows-transfer/part-{n}.txt' for n in range(7)})
          if actual != wanted:
              raise SystemExit('Changed files differ from reviewed allowlist: ' + repr(sorted(actual ^ wanted)))
          print('Exact public changed-file allowlist passed', len(actual))
          PY
          python3 -m unittest scripts.tests.test_windows_read_only -v
          git -c user.name='Game2Mobile Import Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add Windows offline operator GUI core and synthetic tests'
          git push origin HEAD:refs/heads/feat/windows-native-operator
