name: Windows native engineering operator (asset-free)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable read-only CLI gates on actual Windows
        shell: pwsh
        run: |
          python -m unittest scripts.tests.test_windows_read_only -v
          python scripts/g2mctl.py capabilities
          python scripts/g2mctl.py build-plan
          $output = python scripts/g2mctl.py build --execute-local --workspace 'C:\private\game-files' --stage all
          if ($LASTEXITCODE -ne 3) { throw 'Windows iOS build must be refused with code 3' }
          $response = $output | ConvertFrom-Json
          if ($response.code -ne 'NOT_SUPPORTED' -or $response.ok) { throw 'Unsafe Windows build response' }
      - name: Compile actual Windows GUI and run synthetic core smoke tests
        shell: pwsh
        run: |
          dotnet build dm/launcher/WindowsOperator/App/Game2Mobile.Operator.Windows.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI build failed' }
          dotnet run --project dm/launcher/WindowsOperator/Smoke/Game2Mobile.Operator.Smoke.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Windows core smoke failed' }
      - name: Publish offline self-contained win-x64 executable
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'g2m-win-publish'
          dotnet publish dm/launcher/WindowsOperator/App/Game2Mobile.Operator.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None --nologo -o $out
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          if (-not (Test-Path (Join-Path $out 'Game2Mobile.Operator.Windows.exe'))) { throw 'Missing native operator executable' }
          Copy-Item LICENSE (Join-Path $out 'LICENSE')
          Copy-Item dm/launcher/WindowsOperator/README.zh-CN.md (Join-Path $out 'README.zh-CN.md')
          $names = @(Get-ChildItem $out -File | Select-Object -ExpandProperty Name)
          if ($names.Count -gt 24 -or $names -match '(?i)\.pem$|\.p12$|\.nso$|\.romfs$') { throw 'Unexpected release contents' }
          $staging = Join-Path $env:RUNNER_TEMP 'g2m-windows-artifacts'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $package = Join-Path $staging 'Game2Mobile-Operator-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $package -CompressionLevel Optimal
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Game2Mobile-Operator-Windows-x64.zip" | Set-Content -Path (Join-Path $staging 'Game2Mobile-Operator-Windows-x64.zip.sha256') -Encoding ascii
          if ($hash -ne (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'ZIP hash mismatch' }
          Write-Host "Game-free Windows engineering operator created, bytes=$((Get-Item $package).Length), sha256=$hash"
      - name: Upload only the Windows engineering tool and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Game2Mobile-Operator-Windows-x64
          path: ${{ runner.temp }}/g2m-windows-artifacts/
          if-no-files-found: error
          retention-days: 14

  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cross-platform synthetic evidence validator (no game inputs)
        run: |
          dotnet run --project dm/launcher/WindowsOperator/Smoke/Game2Mobile.Operator.Smoke.csproj -c Release --nologo
          python3 -m unittest scripts.tests.test_windows_read_only -v
