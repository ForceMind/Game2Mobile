name: Production source compile inventory (asset-free)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-compile.yml'
      - 'scripts/ci_production_compile.py'
      - 'scripts/ci_xcodegen_profiles.py'
      - 'dm/host/**'
      - 'dm/gfx/**'
      - 'dm/third_party/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-host-object-inventory:
    name: "Inventory: real iOS host ARM64 objects"
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate Apple iPhoneOS compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version

      - name: Compile every tracked Makefile source (iOS 26 Metal 4)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_production_compile.py \
            --profiles metal4 \
            --report "$RUNNER_TEMP/Game2Mobile-production-source-inventory.json"

      - name: Explain classified results without overstating completeness
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"])/"Game2Mobile-production-source-inventory.json"
          if not target.is_file():
              print("Compiler inventory was not produced.")
              raise SystemExit(0)
          report = json.loads(target.read_text())
          counts = report["profiles"].get("metal4", {})
          print("ARM64 production object coverage:", counts)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Real tracked Game2Mobile production sources\n\n")
              f.write(f"- Makefile source entries: **{report['sources_per_profile']}**\n")
              f.write(f"- ARM64 objects compiled: **{counts.get('compiled',0)}**\n")
              f.write(f"- Blocked by game-derived headers: **{counts.get('blocked_generated_asset',0)}**\n")
              f.write(f"- Other compiler errors to investigate: **{counts.get('compile_error',0)}**\n\n")
              f.write("**No proprietary game files were supplied.** This inventory does not link the playable game.\n")
          PY

      - name: Store asset-free per-source compilation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Game2Mobile-PRODUCTION-ARM64-COMPILE-INVENTORY
          path: ${{ runner.temp }}/Game2Mobile-production-source-inventory.json
          if-no-files-found: warn
          retention-days: 14
