name: Apple Silicon native smoke (asset-free)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-native.yml'
      - 'dm/host/**'
      - 'dm/gfx/**'
      - 'dm/ios/**'
      - 'scripts/**'
      - 'assets/brand/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: Native ARM64 / macOS 26
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon and Xcode SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --find clang
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)"
          python3 scripts/release_checks.py source

      - name: Compile and run asset-free native iOS interaction tests
        shell: bash
        run: |
          set -euo pipefail
          make -C dm/ios/tests CC=clang \
            t_touch_controls t_binding_freshness t_portal_sequence \
            t_skill_aim t_joy_travel t_binding_group \
            t_native_hud_identity t_metal_cache_guard t_game_bridge t_native_hud_bridge
          for binary in \
            t_touch_controls t_binding_freshness t_portal_sequence \
            t_skill_aim t_joy_travel t_binding_group \
            t_native_hud_identity t_metal_cache_guard; do
            "./dm/ios/tests/$binary"
          done
          # Game bridge binaries need licensed runtime fixtures to exercise every path.
          # They are compiled above, not counted as validated game integration.

      - name: Compile and run native host core tests
        shell: bash
        run: |
          set -euo pipefail
          make -C dm/host/tests \
            build/t_i18n build/t_textbox build/t_rwlv \
            build/t_widget build/t_padmap build/t_unit_level
          ./dm/host/tests/build/t_textbox
          ./dm/host/tests/build/t_rwlv
          ./dm/host/tests/build/t_widget
          ./dm/host/tests/build/t_padmap
          ./dm/host/tests/build/t_unit_level
          for lang in en zh none sysen systw tags game; do
            TMPDIR="$(pwd)/dm/host/tests/build" ./dm/host/tests/build/t_i18n "$lang"
          done

      - name: Compile native Metal/Objective-C helpers
        shell: bash
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_hmap t_cover t_pace t_pso_skey t_refl t_builtin
          ./dm/gfx/tests/t_hmap
          ./dm/gfx/tests/t_cover
          ./dm/gfx/tests/t_pace
          ./dm/gfx/tests/t_pso_skey
          # GPU execution and game rendering still require separate hardware smoke tests.

      - name: Syntax-check production Metal backend (both APIs) and iOS frontend
        shell: bash
        run: |
          set -euo pipefail
          # These translation units contain the real graphics and UIKit frontend.
          # Compile-checking them does not require user game assets or linking.
          xcrun --sdk macosx clang -fobjc-arc -fsyntax-only -mmacosx-version-min=26.0 \
            -I dm/gfx/nvn/include dm/gfx/nvn/nvn_mtl.m
          xcrun --sdk macosx clang -fobjc-arc -fsyntax-only -mmacosx-version-min=15.0 \
            -DDM_NVN_M3=1 -I dm/gfx/nvn/include dm/gfx/nvn/nvn_mtl.m
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 \
            -isysroot "$ios_sdk" -fobjc-arc -fsyntax-only \
            -I dm/gfx/nvn/include dm/gfx/nvn/nvn_mtl.m
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 \
            -isysroot "$ios_sdk" -fobjc-arc -DDM_NVN_M3=1 -fsyntax-only \
            -I dm/gfx/nvn/include dm/gfx/nvn/nvn_mtl.m
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 \
            -isysroot "$ios_sdk" -fobjc-arc -fsyntax-only \
            -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include \
            dm/ios/Sources/main.m
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 \
            -isysroot "$ios_sdk" -fobjc-arc -fsyntax-only \
            -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include \
            dm/ios/Sources/front_ios.m

      - name: Generate real ARM64 objects from production Metal code
        shell: bash
        run: |
          set -euo pipefail
          # Syntax-only is not sufficient: also run Apple clang codegen and
          # verify that the emitted Mach-O targets are ARM64.
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          out="${RUNNER_TEMP:-/tmp}/game2mobile-native-objects"
          mkdir -p "$out"
          xcrun --sdk macosx clang -fobjc-arc -O0 -c \
            -mmacosx-version-min=26.0 -I dm/gfx/nvn/include \
            dm/gfx/nvn/nvn_mtl.m -o "$out/metal4-macos26.o"
          xcrun --sdk macosx clang -fobjc-arc -O0 -c \
            -mmacosx-version-min=15.0 -DDM_NVN_M3=1 -I dm/gfx/nvn/include \
            dm/gfx/nvn/nvn_mtl.m -o "$out/m3-macos15.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$ios_sdk" \
            -fobjc-arc -O0 -c -I dm/gfx/nvn/include \
            dm/gfx/nvn/nvn_mtl.m -o "$out/metal4-ios26.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -isysroot "$ios_sdk" \
            -DDM_NVN_M3=1 -fobjc-arc -O0 -c -I dm/gfx/nvn/include \
            dm/gfx/nvn/nvn_mtl.m -o "$out/m3-ios18.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$ios_sdk" \
            -fobjc-arc -O0 -c -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include \
            dm/ios/Sources/front_ios.m -o "$out/front-ios26.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$ios_sdk" \
            -fobjc-arc -O0 -c -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include \
            dm/ios/Sources/main.m -o "$out/main-ios26.o"
          # Native host entry and loader: compile real runtime source, not fixtures.
          xcrun --sdk macosx clang -std=gnu11 -O0 -c \
            dm/host/loader.c -o "$out/loader-macos26.o"
          xcrun --sdk macosx clang -std=gnu11 -O0 -c \
            dm/host/main.c -o "$out/host-main-macos26.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$ios_sdk" \
            -std=gnu11 -O0 -c dm/host/loader.c -o "$out/loader-ios26.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$ios_sdk" \
            -std=gnu11 -O0 -c dm/host/main.c -o "$out/host-main-ios26.o"
          for object in "$out"/*.o; do
            test -s "$object"
            test "$(lipo -archs "$object")" = arm64
            echo "$(basename "$object"): $(stat -f '%z' "$object") bytes; $(file -b "$object")"
          done
          echo "ARM64 Mach-O code generation completed; full game linking remains untested."

      - name: Validate real Apple Mach-O section layout parsing (asset-free)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_macho_sections.py

      - name: Type-check Apple-hosted asset downloader extension
        shell: bash
        run: |
          set -euo pipefail
          # This tests the target code with the same Apple iOS SDK, but does
          # not package or upload Apple-hosted commercial game asset packs.
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -swift-version 6 -parse-as-library \
            -target arm64-apple-ios26.0 -sdk "$ios_sdk" -typecheck \
            dm/ios/RomfsDownloader/RomfsDownloader.swift

      - name: Validate native Apple icon conversion
        shell: bash
        run: |
          set -euo pipefail
          src="dm/ios/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/Game2Mobile.iconset"
          for n in 16 32 128 256 512; do
            sips -s format png -z "$n" "$n" "$src" --out "$tmp/Game2Mobile.iconset/icon_${n}x${n}.png" >/dev/null
            twice=$((n*2))
            sips -s format png -z "$twice" "$twice" "$src" --out "$tmp/Game2Mobile.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns "$tmp/Game2Mobile.iconset" -o "$tmp/Game2Mobile.icns"
          test -s "$tmp/Game2Mobile.icns"
          test "$(dd if="$tmp/Game2Mobile.icns" bs=4 count=1 2>/dev/null)" = "icns"
          echo "Validated Game2Mobile.icns ($(stat -f '%z' "$tmp/Game2Mobile.icns") bytes)"

      - name: Record validation boundaries
        shell: bash
        run: |
          printf 'Native Apple ARM64 unit compilation: executed\n'
          printf 'App/Xcode target link: NOT RUN (requires legally provided game files)\n'
          printf 'On-device rendering/input/saves: NOT RUN\n'
          printf 'Signed IPA/Release: NOT CREATED\n'

  native-macos-legacy:
    name: Legacy native ARM64 / macOS 15
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify older Apple Silicon macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Compile legacy Metal M3 backend on actual macOS 15
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -fobjc-arc -O0 -c \
            -mmacosx-version-min=15.0 -DDM_NVN_M3=1 \
            -I dm/gfx/nvn/include dm/gfx/nvn/nvn_mtl.m \
            -o "$RUNNER_TEMP/Game2Mobile-Metal-M3-macos15.o"
          test "$(lipo -archs "$RUNNER_TEMP/Game2Mobile-Metal-M3-macos15.o")" = arm64
          make -C dm/ios/tests CC=clang t_touch_controls t_binding_freshness t_portal_sequence
          ./dm/ios/tests/t_touch_controls
          ./dm/ios/tests/t_binding_freshness
          ./dm/ios/tests/t_portal_sequence
          make -C dm/gfx/tests t_hmap t_cover t_pace
          ./dm/gfx/tests/t_hmap
          ./dm/gfx/tests/t_cover
          ./dm/gfx/tests/t_pace
          echo "macOS 15 M3 compile and asset-free tests passed; complete legacy app not tested."

  ios-project-generation:
    name: "XcodeGen: 4 iOS projects (asset-free)"
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen if necessary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate all signing/Metal profiles and check Xcode targets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_xcodegen_profiles.py \
            --report "$RUNNER_TEMP/game2mobile-xcodegen-report.json"
          python3 -m json.tool "$RUNNER_TEMP/game2mobile-xcodegen-report.json"
      - name: Save asset-free project verification report
        uses: actions/upload-artifact@v4
        with:
          name: game2mobile-xcodegen-profiles
          path: ${{ runner.temp }}/game2mobile-xcodegen-report.json
          if-no-files-found: error
          retention-days: 14
