name: Import verified Game2Mobile source
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ForceMind/Game2Mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Import exactly verified source and rebrand
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/import_and_brand.py
          python3 dm/ios/tools/dm_i18n.py --check
          bash -n setup.sh dm/tools/mac_app.sh dm/ios/tools/shell_build.sh
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          root = Path('.')
          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          assert len(files) >= 1024, len(files)
          assert 'Copyright (c) 2026 jhaizhou' in Path('LICENSE').read_text()
          assert Path('dm/gfx/nvn/nvn_mtl.m').exists()
          assert 'CFBundleDisplayName: Game2Mobile' in Path('dm/ios/project.yml').read_text()
          print('Imported and validated', len(files), 'files')
          PY

      - name: Commit complete source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "feat: import verified project source and rename to Game2Mobile"
          git push origin HEAD:main
