name: Validate Game2Mobile source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization, scripts and source provenance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 dm/ios/tools/dm_i18n.py --check
          bash -n setup.sh dm/tools/mac_app.sh dm/ios/tools/shell_build.sh dm/ios/run.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for relative in ("dm/tools/d2rm_pack.py", "dm/ios/tools/dm_i18n.py", "scripts/import_and_brand.py"):
              ast.parse(Path(relative).read_text(encoding="utf-8"), filename=relative)
          assert "# Game2Mobile" in Path("README.md").read_text(encoding="utf-8")
          assert "# Game2Mobile" in Path("README.zh-CN.md").read_text(encoding="utf-8")
          assert "CFBundleDisplayName: Game2Mobile" in Path("dm/ios/project.yml").read_text()
          assert "Copyright (c) 2026 jhaizhou" in Path("LICENSE").read_text()
          print("Game2Mobile source and branding static checks passed")
          PY

      - name: Offline tests (no Apple SDK or proprietary game files)
        run: |
          python3 dm/i18n/scan_literals.py
          python3 dm/host/tests/native_write_scan.py --selftest dm/host
          python3 dm/host/tests/mode_scan.py dm
          python3 dm/ios/tests/test_input_pair_check.py
          python3 dm/ios/tests/test_touch_receipt.py --source dm/ios/Sources/front_ios.m
          python3 dm/gfx/tests/test_tbdr_budget.py
          python3 dm/tools/test_l3reg.py
          make --no-print-directory -C dm/ios/tests t_touch_controls t_binding_freshness t_portal_sequence
          ./dm/ios/tests/t_touch_controls
          ./dm/ios/tests/t_binding_freshness
          ./dm/ios/tests/t_portal_sequence
      - name: Verify branded source and release gates
        run: |
          python3 scripts/release_checks.py source
          python3 -m unittest discover -s scripts/tests -v
          bash -n dm/tools/mac_app.sh dm/ios/tools/shell_build.sh
