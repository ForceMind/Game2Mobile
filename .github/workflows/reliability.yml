name: Asset-free reliability and source evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record public source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g2m-source"
          git rev-parse HEAD > "$RUNNER_TEMP/g2m-source/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/g2m-source/TREE"
          # Bundle tracked public Git objects only, never .git/config, local.env,
          # ignored resources, credentials, game inputs or workspace outputs.
          git bundle create "$RUNNER_TEMP/g2m-source/source.bundle" HEAD
          cd "$RUNNER_TEMP/g2m-source"
          sha256sum source.bundle > SHA256SUMS
      - name: Upload source-only reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: Game2Mobile-public-source-${{ github.sha }}
          path: ${{ runner.temp }}/g2m-source/
          if-no-files-found: error
          retention-days: 7
      - name: Portable regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 dm/host/tests/test_boot_trace.py
